<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pitch Rehab — Smart Rehab. Stronger Comeback.</title>
    <meta
      name="description"
      content="Rehab plans built around your position and your injury, with pose detection checking every rep."
    />
    <meta name="theme-color" content="#070b09" />
    <!-- Full-screen when saved to a phone home screen, with the status bar
         drawn over the app's own dark header rather than a white strip. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pitch Rehab" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Barlow Condensed carries every number and headline: a rep count can be
         40% larger in the same width, which is what makes the camera screen
         readable from three metres. Barlow handles running text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
